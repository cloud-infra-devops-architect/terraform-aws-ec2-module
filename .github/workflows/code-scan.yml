name: 🚀 Terraform Module Scan
run-name: ${{ github.actor }} has triggered the GitHub Actions
on:
  workflow_call:
    secrets:
      INFRACOST_API_KEY:
        required: true
  push:
    branches-ignore:
      - main
      - dev
      - qa
  pull_request:
    branches:
      - main
      - dev
      - qa
    types: [
        assigned,
        unassigned,
        labeled,
        unlabeled,
        opened,
        edited,
        reopened,
        synchronize,
        converted_to_draft,
        ready_for_review,
        locked,
        unlocked,
        review_requested,
        review_request_removed,
        auto_merge_enabled,
        auto_merge_disabled,
        # closed
      ]

permissions:
  contents: read # This is required for actions/checkout to work properly and fetch the PR branch refs
  pull-requests: write # This is required for gh bot to comment PRs with the plan output
  id-token: write # Without id-token: write, GitHub won't generate the OIDC token needed for authentication.This is required for requesting the JWT token from GitHub IdP and exchanging it for AWS credentials using aws-actions/configure-aws-credentials action. AWS credentials required for Terraform Init to authenticate with private module registries and for Terraform Plan to authenticate with any AWS data sources or providers that require authentication.

env:
  TF_VERSION: "1.7.6" # Terraform version to use for CI/CD
  TF_WORKING_DIR: "." # module root – contains main.tf, variables.tf, examples/, etc.

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 – Security & Compliance Scans
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  security-scans:
    name: 🔍 Security & Compliance Scans
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      checkov_result: ${{ steps.checkov.outputs.result }}
      trivy_result: ${{ steps.trivy.outputs.result }}
      tflint_result: ${{ steps.tflint.outputs.result }}
      gitleaks_result: ${{ steps.gitleaks.outputs.result }}
      checkov_failed: ${{ steps.checkov.outputs.failed }}
      trivy_failed: ${{ steps.trivy.outputs.failed }}
      tflint_failed: ${{ steps.tflint.outputs.failed }}
      gitleaks_failed: ${{ steps.gitleaks.outputs.failed }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # ── Checkov ────────────────────────────────────────────────────────────
      - name: 🛡️ Install & Run Checkov
        id: checkov
        run: |
          pip install checkov --quiet
          set +e
          checkov -d . \
            --framework terraform \
            --quiet \
            --compact \
            --output cli \
            --soft-fail-on MEDIUM \
            --hard-fail-on HIGH,CRITICAL 2>&1 | tee checkov-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Trivy ──────────────────────────────────────────────────────────────
      - name: 🔬 Install & Run Trivy
        id: trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.75.0
          set +e
          trivy config . \
            --config trivy.yaml \
            --exit-code 1 \
            --severity HIGH,CRITICAL 2>&1 | tee trivy-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── TFLint ─────────────────────────────────────────────────────────────
      - name: 🧹 Install & Run TFLint
        id: tflint
        run: |
          TFLINT_VERSION="0.64.0"
          curl -sSfL \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
            -o /tmp/tflint.zip
          unzip -q /tmp/tflint.zip -d /tmp/tflint-bin
          sudo mv /tmp/tflint-bin/tflint /usr/local/bin/tflint
          sudo chmod +x /usr/local/bin/tflint
          tflint --init --config .tflint.hcl
          set +e
          tflint --config .tflint.hcl --recursive 2>&1 | tee tflint-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Gitleaks ───────────────────────────────────────────────────────────
      - name: 🔐 Install & Run Gitleaks
        id: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          set +e
          gitleaks detect \
            --source . \
            --log-opts="HEAD~1..HEAD" \
            --exit-code 1 2>&1 | tee gitleaks-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Upload scan artifacts ───────────────────────────────────────────────
      - name: 📦 Upload scan outputs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: scan-results
          path: |
            checkov-output.txt
            trivy-output.txt
            tflint-output.txt
            gitleaks-output.txt
          retention-days: 7

      # ── Fail job if any scan failed ─────────────────────────────────────────
      - name: 🚫 Fail if any scan failed
        if: |
          steps.checkov.outputs.failed  == 'true' ||
          steps.trivy.outputs.failed    == 'true' ||
          steps.tflint.outputs.failed   == 'true' ||
          steps.gitleaks.outputs.failed == 'true'
        run: |
          echo "One or more security scans failed. See artifacts for details."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 – Repository Structure Checks
  # ─────────────────────────────────────────────────────────────────────────────
  repo-structure:
    name: 📁 Repository Structure Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      examples_main_result: ${{ steps.check_examples_main.outputs.result }}
      examples_variables_result: ${{ steps.check_examples_variables.outputs.result }}
      examples_outputs_result: ${{ steps.check_examples_outputs.outputs.result }}
      examples_readme_result: ${{ steps.check_examples_readme.outputs.result }}
      root_readme_result: ${{ steps.check_root_readme.outputs.result }}
      amazonq_rules_result: ${{ steps.check_amazonq.outputs.result }}
      examples_main_failed: ${{ steps.check_examples_main.outputs.failed }}
      examples_variables_failed: ${{ steps.check_examples_variables.outputs.failed }}
      examples_outputs_failed: ${{ steps.check_examples_outputs.outputs.failed }}
      examples_readme_failed: ${{ steps.check_examples_readme.outputs.failed }}
      root_readme_failed: ${{ steps.check_root_readme.outputs.failed }}
      amazonq_rules_failed: ${{ steps.check_amazonq.outputs.failed }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 📄 Check examples/main.tf
        id: check_examples_main
        run: |
          if [ -f "examples/main.tf" ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📄 Check examples/variables.tf
        id: check_examples_variables
        run: |
          if [ -f "examples/variables.tf" ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📄 Check examples/outputs.tf
        id: check_examples_outputs
        run: |
          if [ -f "examples/outputs.tf" ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📄 Check examples/README.md
        id: check_examples_readme
        run: |
          if [ -f "examples/README.md" ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📄 Check root README.md
        id: check_root_readme
        run: |
          if [ -f "README.md" ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🤖 Check .amazonq/rules/ directory
        id: check_amazonq
        run: |
          COUNT=$(find .amazonq/rules -name "*.md" 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚫 Fail if any structure check failed
        if: |
          steps.check_examples_main.outputs.failed      == 'true' ||
          steps.check_examples_variables.outputs.failed == 'true' ||
          steps.check_examples_outputs.outputs.failed   == 'true' ||
          steps.check_examples_readme.outputs.failed    == 'true' ||
          steps.check_root_readme.outputs.failed        == 'true' ||
          steps.check_amazonq.outputs.failed            == 'true'
        run: |
          echo "One or more required files/directories are missing."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 – Scan Results Summary (PR comment)
  # ─────────────────────────────────────────────────────────────────────────────
  scan-summary:
    name: 📊 Scan Results Summary
    runs-on: ubuntu-latest
    needs: [security-scans, repo-structure]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: 💬 Post PR comment with results table
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const secNeeds  = ${{ toJSON(needs['security-scans'].outputs) }};
            const repoNeeds = ${{ toJSON(needs['repo-structure'].outputs) }};

            const secStatus  = '${{ needs.security-scans.result }}';
            const repoStatus = '${{ needs.repo-structure.result }}';

            const rows = [
              { icon: '🛡️',  check: 'Checkov (SAST)',              result: secNeeds.checkov_result  || '⏭️ Skipped' },
              { icon: '🔬',  check: 'Trivy (Misconfig & Secrets)',  result: secNeeds.trivy_result    || '⏭️ Skipped' },
              { icon: '🧹',  check: 'TFLint (Linting)',             result: secNeeds.tflint_result   || '⏭️ Skipped' },
              { icon: '🔐',  check: 'Gitleaks (Secret Detection)',  result: secNeeds.gitleaks_result || '⏭️ Skipped' },
              { icon: '📄',  check: 'examples/main.tf exists',      result: repoNeeds.examples_main_result      || '⏭️ Skipped' },
              { icon: '📄',  check: 'examples/variables.tf exists', result: repoNeeds.examples_variables_result || '⏭️ Skipped' },
              { icon: '📄',  check: 'examples/outputs.tf exists',   result: repoNeeds.examples_outputs_result   || '⏭️ Skipped' },
              { icon: '📄',  check: 'examples/README.md exists',    result: repoNeeds.examples_readme_result    || '⏭️ Skipped' },
              { icon: '📄',  check: 'Root README.md exists',        result: repoNeeds.root_readme_result        || '⏭️ Skipped' },
              { icon: '🤖',  check: '.amazonq/rules/ exists',       result: repoNeeds.amazonq_rules_result      || '⏭️ Skipped' },
            ];

            const overallPass = secStatus === 'success' && repoStatus === 'success';
            const overallIcon = overallPass ? '✅' : '❌';
            const overallText = overallPass ? 'All checks passed — PR is ready to merge.' : 'One or more checks failed — PR is blocked.';

            let table = '## 🚀 Terraform EC2 Module – CI Scan Results\n\n';
            table += `| Icon | Check | Result |\n`;
            table += `|------|-------|--------|\n`;
            for (const r of rows) {
              table += `| ${r.icon} | ${r.check} | ${r.result} |\n`;
            }
            table += `\n### Overall: ${overallIcon} ${overallText}\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: table
            });

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 – Terraform CI (fmt, init, validate, plan)
  # ─────────────────────────────────────────────────────────────────────────────
  terraform-ci:
    name: 🏗️ Terraform CI
    runs-on: ubuntu-latest
    needs: [security-scans, repo-structure]
    if: needs.security-scans.result == 'success' && needs.repo-structure.result == 'success' && github.event_name == 'pull_request'

    env:
      TF_IN_AUTOMATION: "true"
      STRICT_OIDC_INTERNAL_PR: ${{ fromJSON(toJSON(vars)).STRICT_OIDC_INTERNAL_PR || 'false' }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Fetch full history to ensure Terraform can access all branches and tags if needed for module references

      - name: "Configure AWS Credentials"
        id: aws_credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ${{ secrets.ROLE_SESSION_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS OIDC fallback notice
        if: steps.aws_credentials.outcome == 'failure'
        run: |
          echo "::warning::OIDC role assumption failed (sts:AssumeRoleWithWebIdentity)."
          echo "::warning::Skipping terraform plan in this run. Verify AWS role trust policy allows this repository/event context."

      - name: Debug OIDC subject claim
        if: steps.aws_credentials.outcome == 'failure'
        run: |
          set -euo pipefail
          oidc_response=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          oidc_jwt=$(echo "$oidc_response" | jq -r '.value')
          jwt_payload=$(echo "$oidc_jwt" | cut -d'.' -f2 | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2) print $0 "=="; else if(l==3) print $0 "="; else print $0}' | base64 -d)

          echo "OIDC claim check (for IAM trust policy):"
          echo "$jwt_payload" | jq -r '. | "aud=\(.aud)\nsub=\(.sub)\nrepository=\(.repository)\nevent_name=\(.event_name)"'

      - name: Enforce strict OIDC mode for internal PRs
        if: env.STRICT_OIDC_INTERNAL_PR == 'true' && steps.aws_credentials.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "::error::OIDC strict mode is enabled and AWS role assumption failed for an internal PR."
          echo "::error::Fix IAM trust policy/permissions for sts:AssumeRoleWithWebIdentity or disable STRICT_OIDC_INTERNAL_PR."
          exit 1

      - name: Verify IAM Role Assumption
        if: steps.aws_credentials.outcome == 'success'
        run: |
          aws sts get-caller-identity

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v3.1.2
        with:
          terraform_version: latest
          terraform_wrapper: false

      # ── terraform fmt ───────────────────────────────────────────────────────
      - name: 🎨 Terraform Format Check
        id: fmt
        run: |
          set +e
          terraform fmt -check -recursive 2>&1 | tee fmt-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
            cat fmt-output.txt
          fi
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      # ── terraform init ──────────────────────────────────────────────────────
      - name: 🔧 Terraform Init
        id: init
        run: |
          set +e
          terraform init -backend=false 2>&1 | tee init-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
          fi
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      # ── terraform validate ──────────────────────────────────────────────────
      - name: ✅ Terraform Validate
        id: validate
        run: |
          set +e
          terraform validate 2>&1 | tee validate-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
          fi
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      # ── terraform plan ──────────────────────────────────────────────────────
      - name: 📋 Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan \
            -var="name=ci-validation" \
            -var="instance_type=t3.micro" \
            -var="subnet_id=subnet-00000000000000000" \
            -input=false \
            -no-color 2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "result=✅ PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=❌ FAIL" >> "$GITHUB_OUTPUT"
          fi
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      # ── Post Terraform results to PR ────────────────────────────────────────
      - name: 💬 Post Terraform CI results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fmt      = '${{ steps.fmt.outputs.result }}';
            const init     = '${{ steps.init.outputs.result }}';
            const validate = '${{ steps.validate.outputs.result }}';
            const plan     = '${{ steps.plan.outputs.result }}';

            const allPass = [fmt, init, validate, plan].every(r => r.includes('PASS'));
            const overall = allPass ? '✅ All Terraform checks passed.' : '❌ One or more Terraform checks failed — PR is blocked.';

            const body = [
              '## 🏗️ Terraform CI Results',
              '',
              '| Icon | Step | Result |',
              '|------|------|--------|',
              `| 🎨 | terraform fmt   | ${fmt}      |`,
              `| 🔧 | terraform init  | ${init}     |`,
              `| ✅ | terraform validate | ${validate} |`,
              `| 📋 | terraform plan  | ${plan}     |`,
              '',
              `### ${overall}`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # ── Upload Terraform artifacts ──────────────────────────────────────────
      - name: 📦 Upload Terraform outputs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: terraform-ci-results
          path: |
            fmt-output.txt
            init-output.txt
            validate-output.txt
            plan-output.txt
          retention-days: 7

      # ── Fail job if any Terraform step failed ───────────────────────────────
      - name: 🚫 Fail if any Terraform step failed
        if: |
          steps.fmt.outputs.result      == '❌ FAIL' ||
          steps.init.outputs.result     == '❌ FAIL' ||
          steps.validate.outputs.result == '❌ FAIL' ||
          steps.plan.outputs.result     == '❌ FAIL'
        run: |
          echo "One or more Terraform CI steps failed. See artifacts for details."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5 – Infracost Cost Estimate (feature branch push)
  # ─────────────────────────────────────────────────────────────────────────────
  infracost-estimate:
    name: 💰 Infracost Cost Estimate
    runs-on: ubuntu-latest
    needs: [security-scans, repo-structure]
    if: |
      needs.security-scans.result == 'success' &&
      needs.repo-structure.result == 'success' &&
      github.event_name == 'push'

    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v3.1.2
        with:
          terraform_version: latest
          terraform_wrapper: false # required for Infracost to parse plan JSON

      - name: 💰 Setup Infracost
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # ── terraform init in examples/ ─────────────────────────────────────────
      - name: 🔧 Terraform Init (examples)
        run: terraform init -backend=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      # ── Generate Infracost breakdown JSON and table ──────────────────────────
      - name: 📊 Generate Infracost breakdown
        run: |
          infracost breakdown \
            --path ${{ env.TF_WORKING_DIR }} \
            --format json \
            --out-file /tmp/infracost-base.json
          infracost output \
            --path /tmp/infracost-base.json \
            --format table | tee infracost-table.txt

      # ── Upload JSON + table as artifact ─────────────────────────────────────
      - name: 📦 Upload Infracost artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: infracost-results
          path: |
            /tmp/infracost-base.json
            infracost-table.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6 – Infracost PR Comment
  # ─────────────────────────────────────────────────────────────────────────────
  infracost-comment:
    name: 💬 Infracost PR Comment
    runs-on: ubuntu-latest
    needs: [security-scans, repo-structure]
    if: |
      needs.security-scans.result == 'success' &&
      needs.repo-structure.result == 'success' &&
      github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

    steps:
      # ── Checkout base branch (target of the PR) ─────────────────────────────
      - name: 📥 Checkout base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      # ── Checkout head branch (the feature branch / PR source) ──────────────
      - name: 📥 Checkout head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: head

      # ── Run diff and post/update PR comment ───────────────────────────────
      - name: 💬 Post Infracost diff comment
        uses: infracost/actions/diff@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: base/examples
          head-path: head/examples
